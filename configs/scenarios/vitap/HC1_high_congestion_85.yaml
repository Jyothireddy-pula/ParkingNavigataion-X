# HC1: High Congestion — 85% target peak utilisation
# Total capacity: 472 usable spaces. At equilibrium with 120-min median dwell:
#   peak arrival rate needed ≈ 0.85 × 472 / 120 ≈ 3.3 veh/min
# vehicle_count=900 gives ~85% average utilisation under lognormal dwell.
# Purpose: test P vs B3 under realistic congestion where prediction matters.
# Strategies: B1, B2, B3, P (all four) — 30 seeds per strategy.
scenario_id: vitap-hc1-85pct
campus_id: vitap
name: HC1_HIGH_CONGESTION_85
description: "High congestion: 85% target peak utilisation. 900 vehicles, 10 hours."
duration_minutes: 600
vehicle_count: 900
start_time_min: 480
arrival_rate_profile:
  type: profile
  points:
    - { time: 0,   rate: 0.5  }
    - { time: 60,  rate: 2.7  }
    - { time: 120, rate: 2.0  }
    - { time: 240, rate: 1.5  }
    - { time: 360, rate: 2.1  }
    - { time: 480, rate: 1.0  }
    - { time: 540, rate: 0.5  }
    - { time: 600, rate: 0.2  }
event_conditions: null
availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []
prediction_error_injection_level: 0.0
random_seed: 7
warmdown_minutes: 30
use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
