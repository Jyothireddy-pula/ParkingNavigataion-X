# HC3: High Congestion — 95% target peak utilisation (near-full campus)
# Total capacity: 472 usable spaces. At equilibrium with 120-min median dwell:
#   peak arrival rate needed ≈ 0.95 × 472 / 120 ≈ 3.7 veh/min
# vehicle_count=1300 drives campus close to saturation; overflow events expected.
# This is the primary scenario for demonstrating P's predictive advantage.
scenario_id: vitap-hc3-95pct
campus_id: vitap
name: HC3_HIGH_CONGESTION_95
description: "High congestion: 95% target peak utilisation. 1300 vehicles, 10 hours."
duration_minutes: 600
vehicle_count: 1300
start_time_min: 480
arrival_rate_profile:
  type: profile
  points:
    - { time: 0,   rate: 0.7  }
    - { time: 60,  rate: 3.9  }
    - { time: 120, rate: 3.0  }
    - { time: 240, rate: 2.2  }
    - { time: 360, rate: 3.0  }
    - { time: 480, rate: 1.5  }
    - { time: 540, rate: 0.7  }
    - { time: 600, rate: 0.2  }
event_conditions: null
availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []
prediction_error_injection_level: 0.0
random_seed: 7
warmdown_minutes: 30
use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
