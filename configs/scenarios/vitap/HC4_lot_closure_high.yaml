# HC4: High Congestion + Timed Lot Closure
# 85% base utilisation; academic lot (108 spaces) closes at t=120 for 2 hours.
# Remaining capacity drops to 364 spaces → ~95% effective utilisation during closure.
# Tests P's ability to redistribute demand proactively when supply is reduced.
scenario_id: vitap-hc4-lot-closure-high
campus_id: vitap
name: HC4_LOT_CLOSURE_HIGH
description: "High congestion with academic lot closure t=120-240. Tests proactive redistribution."
duration_minutes: 600
vehicle_count: 900
start_time_min: 480
arrival_rate_profile:
  type: profile
  points:
    - { time: 0,   rate: 0.5  }
    - { time: 60,  rate: 2.7  }
    - { time: 120, rate: 2.0  }
    - { time: 240, rate: 1.5  }
    - { time: 360, rate: 2.1  }
    - { time: 480, rate: 1.0  }
    - { time: 540, rate: 0.5  }
    - { time: 600, rate: 0.2  }
event_conditions: null
availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []
  timed_closures:
    - entity_type: parking_lot
      entity_id: vitap-lot-academic-main
      start_tick: 120
      end_tick: 240
prediction_error_injection_level: 0.0
random_seed: 7
warmdown_minutes: 30
use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
