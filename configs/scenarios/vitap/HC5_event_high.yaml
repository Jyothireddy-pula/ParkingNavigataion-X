# HC5: High Congestion + Campus Event Demand Spike
# 90% base utilisation; 2× demand spike during 09:15-11:00 (event arrival window).
# Tests P's ability to handle predictable demand spikes when lots are already congested.
scenario_id: vitap-hc5-event-high
campus_id: vitap
name: HC5_EVENT_HIGH
description: "High congestion + 2.0x event demand spike at 09:15-11:00. 1100 vehicles."
duration_minutes: 600
vehicle_count: 1100
start_time_min: 480
arrival_rate_profile:
  type: profile
  points:
    - { time: 0,   rate: 0.6  }
    - { time: 60,  rate: 3.3  }
    - { time: 120, rate: 2.5  }
    - { time: 240, rate: 1.8  }
    - { time: 360, rate: 2.5  }
    - { time: 480, rate: 1.2  }
    - { time: 540, rate: 0.6  }
    - { time: 600, rate: 0.2  }
event_conditions:
  ad_hoc: true
  demand_multiplier: 2.0
  start_tick: 75
  duration_ticks: 105
  affected_zones: [academic]
  compliance_rate: 0.85
availability_overrides:
  closed_gates: []
  closed_parking_lots: []
  closed_roads: []
prediction_error_injection_level: 0.0
random_seed: 7
warmdown_minutes: 30
use_prediction: true
use_optimization: true
use_uncertainty: true
proactive: true
